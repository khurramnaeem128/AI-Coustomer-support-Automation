<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Customer Support</title>
  <style>
    :root { --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a; --text: #e8eaed; --muted: #9aa0aa; --accent: #4f8cff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 28px; }
    h1 { margin: 0 0 4px; font-size: 1.35rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
    label { display: block; margin: 14px 0 6px; font-size: .85rem; color: var(--muted); }
    input, textarea { width: 100%; padding: 11px 12px; background: #0f1115; color: var(--text);
                      border: 1px solid var(--border); border-radius: 8px; font-size: .95rem; }
    textarea { min-height: 110px; resize: vertical; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #result { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; font-size: .9rem; }
    #result.success { background: #11351f; color: #7ee2a8; }
    #result.error { background: #3a1416; color: #f3a1a6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Customer Support</h1>
    <p class="sub">Send us your inquiry and our team will get back to you.</p>

    <form id="customerForm">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button id="submitButton" type="submit">Submit Inquiry</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("customerForm");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !message) {
        showResult("Please complete all required fields.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Sending...";

      try {
        // Relative URL — works on any domain the site is deployed to.
        const response = await fetch("/api/customer-inquiry", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, message })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showResult(
            data.response || data.message || "Your inquiry was submitted successfully.",
            "success"
          );
          form.reset();
        } else {
          showResult(data.detail || data.message || "Something went wrong. Please try again.", "error");
        }
      } catch (error) {
        showResult("Unable to connect to the support system. Please try again.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit Inquiry";
      }
    });

    function showResult(message, type) {
      result.textContent = message;
      result.className = type;
      result.style.display = "block";
    }
  </script>
</body>
</html>
